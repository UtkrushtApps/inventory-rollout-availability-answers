apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: cartforge
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 40
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A serviceable replacement must exist before an old replica is removed.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-api
        app.kubernetes.io/component: api
    spec:
      # Covers preStop endpoint draining, in-flight requests, and the bounded
      # application shutdown delay without allowing unbounded termination.
      terminationGracePeriodSeconds: 15
      containers:
        - name: inventory-api
          image: inventory-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: inventory-api-config
          resources:
            # Requests are deliberately small enough for three pods (the two
            # desired replicas plus one surge replica) on the task's minikube
            # node. The original 700m request made maxUnavailable: 0 deadlock.
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          lifecycle:
            preStop:
              # Pod deletion removes readiness from EndpointSlices first. Keep
              # the process serving briefly while kube-proxy/client routing
              # converges, then let SIGTERM trigger Uvicorn's graceful drain.
              exec:
                command: ["/bin/sh", "-c", "sleep 3"]
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 3
